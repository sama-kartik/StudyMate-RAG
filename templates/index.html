<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMate – RAG Course Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>StudyMate</h1>
    <p class="tagline">Ask questions about your course material</p>

    <label class="upload" id="dropzone">
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
      <strong>Upload PDFs</strong>
      <span>Click or drop notes, syllabus, textbooks</span>
    </label>
    <div id="uploadStatus" class="status"></div>

    <h2>Documents</h2>
    <ul id="docList" class="docs"><li class="muted">No documents yet</li></ul>

    <h2>Search in</h2>
    <select id="scope"><option value="">All documents</option></select>
  </aside>

  <main class="chat">
    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="bubble">
          Hi! Upload your course PDFs on the left, then ask me anything about them.
          Every answer cites the file and page it came from.
        </div>
      </div>
    </div>
    <form id="chatForm" class="composer">
      <textarea id="question" rows="1" placeholder="e.g. Explain normalization with an example" required></textarea>
      <button type="submit" id="sendBtn">Ask</button>
    </form>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
