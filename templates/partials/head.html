<script>
  /* Apply the saved theme before the page paints (default: dark). */
  (function () {
    var t = null;
    try { t = localStorage.getItem("studymate-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
